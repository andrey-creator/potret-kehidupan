<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Potret Kehidupan — kepingan hidup dalam gambar.">
  <meta name="theme-color" content="#f1eee8">
  <title>Potret Kehidupan — Kepingan hidup dalam gambar.</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header shell">
    <div class="header-rule"></div>
    <div class="header-meta">
      <span>Album pribadi</span>
      <span>Jurnal visual · <span id="currentYear">2026</span></span>
    </div>
    <div class="header-intro">
      <h1>Potret<br>Kehidupan</h1>
      <p class="intro-note">Kepingan hidup dalam gambar.</p>
    </div>
  </header>

  <main class="gallery-section shell">
    <div class="gallery-heading" aria-hidden="true">
      <p>Fragmen yang disimpan</p>
      <p><span id="galleryCount">—</span> momen</p>
    </div>
    <section class="gallery" id="gallery" aria-label="Galeri foto Potret Kehidupan">
      <div class="gallery-loading" id="galleryLoading" role="status">Memuat momen…</div>
    </section>
  </main>

  <footer class="site-footer shell">
    <div class="footer-rule"></div>
    <div class="footer-meta">
      <!-- EDIT IDENTITAS DI SINI: ganti nama sesuai kebutuhan. -->
      <span class="footer-name">Nama Anda · <span id="footerYear">2026</span></span>
      <!-- EDIT TAUTAN DI SINI: ganti atau hapus tautan media sosial. -->
      <nav class="footer-links" aria-label="Tautan media sosial">
        <a class="social-link" href="https://instagram.com" target="_blank" rel="noreferrer">Instagram</a>
        <a class="social-link" href="https://youtube.com" target="_blank" rel="noreferrer">YouTube</a>
      </nav>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Tampilan foto besar" hidden>
    <div class="lightbox-panel">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Tutup tampilan foto">×</button>
      <div class="lightbox-image-wrap" id="lightboxBackdrop">
        <img class="lightbox-image" id="lightboxImage" src="" alt="">
      </div>
      <div class="lightbox-side">
        <p class="lightbox-caption" id="lightboxCaption"></p>
        <p class="lightbox-count" id="lightboxCount"></p>
        <div class="lightbox-controls" aria-label="Navigasi foto">
          <button class="lightbox-control" id="lightboxPrevious" type="button" aria-label="Foto sebelumnya">←</button>
          <button class="lightbox-control" id="lightboxNext" type="button" aria-label="Foto berikutnya">→</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
