<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f1eee8">
  <title>Halaman tidak ditemukan — Potret Kehidupan</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bone: #f1eee8; --ink: #202521; --muted: #7a7d76; --line: rgba(32, 37, 33, .16); --sage: #7b8a78; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: var(--bone); color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300;
    }
    main { width: min(100%, 36rem); border-top: 1px solid var(--line); padding-top: 1.5rem; }
    p.kicker { margin: 0 0 3rem; color: var(--muted); font-size: .67rem; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 12vw, 5.5rem); font-weight: 400; letter-spacing: -.07em; line-height: .9; }
    p.note { margin: 1.5rem 0 2rem; color: var(--muted); font-size: 1.05rem; line-height: 1.5; }
    a { color: var(--ink); font-size: .67rem; letter-spacing: .15em; text-decoration: none; text-transform: uppercase; border-bottom: 1px solid var(--sage); padding-bottom: .25rem; }
    a:hover, a:focus-visible { border-bottom-color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Potret Kehidupan · 404</p>
    <h1>Tidak<br>ditemukan.</h1>
    <p class="note">Halaman yang Anda cari tidak ada, atau sudah dipindahkan.</p>
    <a href="/">Kembali ke galeri</a>
  </main>
</body>
</html>
