name = "potret-kehidupan"
compatibility_date = "2026-10-09"
pages_build_output_dir = "dist"

# GANTI database_id setelah membuat database D1 di akun Cloudflare Anda.
[[d1_databases]]
binding = "DB"
database_name = "potret-kehidupan"
database_id = "GANTI_DENGAN_DATABASE_ID"

# Buat bucket R2 bernama potret-kehidupan-media, lalu hubungkan binding ini.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "potret-kehidupan-media"

# ADMIN_TOKEN harus dibuat sebagai secret di Cloudflare Pages.
# Jangan pernah menaruh nilai token asli di file ini atau GitHub.
